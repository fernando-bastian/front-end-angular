<header class="page-heading">
  <h2>Categorias</h2>
</header>

<section class="panel category-panel" aria-labelledby="editar-categoria">
  <div class="panel-heading">
    <h3 id="editar-categoria">Editar categoria</h3>
  </div>

  <div class="category-field">
    <label for="nome-categoria">Nome da categoria</label>
    <input
      id="nome-categoria"
      type="text"
      [(ngModel)]="nomeCategoria"
      aria-describedby="categoria-ajuda"
    />
    <p id="categoria-ajuda">Use um nome como Alimentação, Transporte ou Lazer.</p>
  </div>

  <div class="panel-footer">
    <p>O nome será exibido em uma mensagem na tela.</p>
    <button type="button" (click)="mostrar()">Mostrar</button>
  </div>
</section>

<p class="persistence-note">Nesta demonstração, as alterações ficam apenas nesta tela.</p>
