<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
<div class="app-layout">
  <header class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">f.</span>
      <h1>Financeiro</h1>
    </div>

    @if (api.usuario(); as usuario) {
      <nav aria-label="Navegação principal">
        <a
          routerLink="/"
          routerLinkActive="ativo"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          ><span class="nav-icon" aria-hidden="true">◈</span> Visão geral</a
        >
        <a routerLink="/categorias" routerLinkActive="ativo" ariaCurrentWhenActive="page">
          <span class="nav-icon" aria-hidden="true">▦</span>
          Categorias
        </a>
        <a routerLink="/contas" routerLinkActive="ativo" ariaCurrentWhenActive="page">
          <span class="nav-icon" aria-hidden="true">▣</span>
          Contas
        </a>
        <a routerLink="/transacoes" routerLinkActive="ativo" ariaCurrentWhenActive="page"
          ><span class="nav-icon" aria-hidden="true">↕</span> Transações</a
        >
        <a routerLink="/transferencias" routerLinkActive="ativo" ariaCurrentWhenActive="page"
          ><span class="nav-icon" aria-hidden="true">⇄</span> Transferências</a
        >
      </nav>
      <div class="sessao">
        <p>{{ usuario.nome }}</p>
        <button type="button" (click)="sair()" [disabled]="saindo()">
          {{ saindo() ? 'Saindo...' : 'Sair' }}
        </button>
      </div>
    }
    @if (erro()) {
      <p class="mensagem erro" role="alert">{{ erro() }}</p>
    }
    <p class="project-status">Gestão financeira</p>
  </header>

  <main id="conteudo" tabindex="-1">
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
