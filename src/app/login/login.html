<section class="panel login-panel">
  <header class="page-heading">
    <h2>Entrar</h2>
    <p>Acesse suas contas e movimentações.</p>
  </header>
  @if (erro()) {
    <p class="mensagem erro" role="alert">{{ erro() }}</p>
  }
  <form (ngSubmit)="entrar()" #form="ngForm">
    <div class="campo">
      <label for="email">E-mail</label
      ><input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        email
        maxlength="254"
        autocomplete="username"
      />
    </div>
    <div class="campo">
      <label for="senha">Senha</label
      ><input
        id="senha"
        name="senha"
        type="password"
        [(ngModel)]="senha"
        required
        maxlength="128"
        autocomplete="current-password"
      />
    </div>
    <button type="submit" [disabled]="form.invalid || entrando()">
      {{ entrando() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</section>
